name: GitHub Snake Game

on:
  # Schedule the workflow to run daily at midnight UTC
  schedule:
    - cron: "0 0 * * *"

  # Allow manual triggering of the workflow
  workflow_dispatch:

  # Trigger the workflow on pushes to the main branch
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Step 1: Checkout the repository
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Step 2: Generate the snake animations
      - name: Generate GitHub Contributions Snake Animations
        uses: Platane/snk@v3
        with:
          # GitHub username to generate the animation for
          github_user_name: ${{ github.repository_owner }}

          # Define the output files and their configurations
          outputs: |
            dist/github-snake.svg?color_snake=%23b3ff5c&color_dots=%23161b22,%231a3d5c,%23316b9e,%237db1c7,%23a4f5e9
            dist/github-snake-dark.svg?color_snake=%23b3ff5c&color_dots=%23161b22,%231a3d5c,%23316b9e,%237db1c7,%23a4f5e9
            dist/ocean.gif?color_snake=%23b3ff5c&color_dots=%23161b22,%231a3d5c,%23316b9e,%237db1c7,%23a4f5e9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Step 3: Apply shifting gradient and segment colors to snake SVG animation
      - name: Apply Gradient to Snake Animation
        run: |
          sudo chown -R $USER:$USER dist || true
          python3 -c '
          import glob

          for path in glob.glob("dist/*.svg"):
              try:
                  with open(path, "r", encoding="utf-8") as f:
                      content = f.read()

                  # Inject linearGradient with animated shifting stops
                  grad = (
                      "<defs><linearGradient id=\"snake-gradient\" x1=\"0%\" y1=\"0%\" x2=\"100%\" y2=\"100%\">"
                      "<stop offset=\"0%\" stop-color=\"#3e9e4f\"><animate attributeName=\"stop-color\" values=\"#3e9e4f;#89cf78;#b3ff5c;#3e9e4f\" dur=\"4s\" repeatCount=\"indefinite\"/></stop>"
                      "<stop offset=\"50%\" stop-color=\"#89cf78\"><animate attributeName=\"stop-color\" values=\"#89cf78;#b3ff5c;#3e9e4f;#89cf78\" dur=\"4s\" repeatCount=\"indefinite\"/></stop>"
                      "<stop offset=\"100%\" stop-color=\"#b3ff5c\"><animate attributeName=\"stop-color\" values=\"#b3ff5c;#3e9e4f;#89cf78;#b3ff5c\" dur=\"4s\" repeatCount=\"indefinite\"/></stop>"
                      "</linearGradient></defs>"
                  )

                  if "<defs>" not in content:
                      content = content.replace("<desc>", grad + "<desc>", 1)

                  # Apply gradient fill
                  content = content.replace("fill:var(--cs)", "fill:url(#snake-gradient)")

                  # Apply body segment colors: head (#b3ff5c) -> body (#89cf78, #65b863) -> tail (#3e9e4f)
                  seg_css = ".s.s0{fill:#b3ff5c;filter:drop-shadow(0 0 2px #b3ff5c);}.s.s1{fill:#89cf78;}.s.s2{fill:#65b863;}.s.s3{fill:#3e9e4f;}.s.s0{"
                  if ".s.s0{" in content and "filter:drop-shadow" not in content:
                      content = content.replace(".s.s0{", seg_css, 1)

                  with open(path, "w", encoding="utf-8") as f:
                      f.write(content)
                  print(f"Gradient successfully applied to {path}")
              except Exception as e:
                  print(f"Notice while processing {path}: {e}")
          ' || true

      # Step 4: Deploy the generated files to the 'output' branch
      - name: Deploy to Output Branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          commit_message: "Update snake animation [skip ci]"
