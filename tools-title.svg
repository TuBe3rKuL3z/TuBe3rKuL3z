<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 50" width="450" height="50">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="pill-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b10" />
      <stop offset="50%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#080b10" />
    </linearGradient>

    <!-- Neon Border Gradient: #7db1c7 -> #89cf78 -->
    <linearGradient id="neon-border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7db1c7" />
      <stop offset="50%" stop-color="#a4f5e9" />
      <stop offset="100%" stop-color="#89cf78" />
    </linearGradient>

    <!-- Subtle Nebula Accent -->
    <radialGradient id="pill-nebula" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#316b9e" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#3e9e4f" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#080b10" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    svg {
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Neon Border styling */
    .title-pill-border {
      stroke: url(#neon-border-grad);
      stroke-width: 1.8;
      fill: url(#pill-bg);
      filter: drop-shadow(0 0 3px rgba(125, 177, 199, 0.45));
      transition: stroke 0.4s ease, filter 0.4s ease;
    }

    svg:hover .title-pill-border {
      stroke: #b3ff5c;
      filter: drop-shadow(0 0 5px #b3ff5c) drop-shadow(0 0 12px rgba(179, 255, 92, 0.7));
    }

    /* Centered Text */
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 3.5px;
      fill: #ffffff;
      text-anchor: middle;
      transition: fill 0.4s ease, filter 0.4s ease;
    }

    svg:hover .title-text {
      fill: #b3ff5c;
      filter: drop-shadow(0 0 6px #b3ff5c) drop-shadow(0 0 12px rgba(179, 255, 92, 0.5));
    }

    /* Twinkling Accent Stars */
    @keyframes starPulse {
      0%, 100% { opacity: 0.3; transform: scale(0.85); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    .accent-star {
      transform-box: fill-box;
      transform-origin: center;
      animation: starPulse 2.8s ease-in-out infinite alternate;
    }
    .star-2 {
      animation-delay: 1.4s;
    }
  </style>

  <!-- Base Pill with Border -->
  <rect class="title-pill-border" x="1.5" y="1.5" width="447" height="47" rx="16" />

  <!-- Soft Ambient Nebula Glow -->
  <rect x="2" y="2" width="446" height="46" rx="15" fill="url(#pill-nebula)" />

  <!-- Micro cosmic accents -->
  <circle class="accent-star" cx="32" cy="25" r="1.3" fill="#a4f5e9" />
  <circle class="accent-star star-2" cx="418" cy="25" r="1.3" fill="#b3ff5c" />

  <!-- Title Text: ЯЗЫКИ И ИНСТРУМЕНТЫ -->
  <text x="225" y="31.5" class="title-text">ЯЗЫКИ И ИНСТРУМЕНТЫ</text>
</svg>
